    <script>
        $(function msieversion() {
            var ua = window.navigator.userAgent;
            var msie = ua.indexOf("MSIE ");
            if (msie > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./)) {
                document.querySelector('html').dataset.browser = 'ie11';
            }
            else {
                var breakpoint;
                var getBreakpoint = function () {
                    return window.getComputedStyle(document.body, '::before').content.replace(/\"/g, '');
                };

                var displayBreakpoint = function () {
                    document.querySelector('html').dataset.layout = breakpoint;
                };

                breakpoint = getBreakpoint();
                displayBreakpoint();
                window.addEventListener('resize', function () {
                    breakpoint = getBreakpoint();
                    displayBreakpoint();
                }, false);
            }
            return false;
        });
    </script>

        a.download:hover, button.download:hover {

        .back-btn {
            position: absolute;
            display: none;
            border: none;
            z-index: 1;
            top: 30px;
            left: 15px;
            cursor: pointer;
        }

        .back-btn::before,
        .back-btn::after {
            content: "";
            display: block;
            background: #fafafa;
            width: 15px;
            height: 5px;
            border-radius: 25px;
        }

        .back-btn::before {
            transform: rotate(135deg);
            box-shadow: #1c7cd4 2px 2px 5px;
        }

        .back-btn::after {
            transform: rotate(-135deg);
            position: absolute;
            top: 7.5px;
        }

        .visual {

            max-width: 500px;
